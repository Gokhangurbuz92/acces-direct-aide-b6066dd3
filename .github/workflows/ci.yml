name: CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  validation:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
            VITE_GIT_COMMIT_SHA: ${{ github.sha }}
            # Mock env vars needed for build/types if any
            VITE_SENTRY_DSN: ""

      - name: Run API Tests
        run: npm run test:api

  smoke-test:
    name: Smoke Test (Preview)
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for Preview
        run: npm run build
        env:
            VITE_GIT_COMMIT_SHA: ${{ github.sha }}

      - name: Start Preview Server
        run: npm run preview -- --port 4173 &

      - name: Wait for Server
        run: npx wait-on http://localhost:4173 --timeout 60000

      - name: Run Healthcheck
        run: node scripts/ci-healthcheck.js http://localhost:4173 --allow-noindex
