name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Quality & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: acces_direct_aide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/acces_direct_aide_test
      DIRECT_URL: postgresql://postgres:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/acces_direct_aide_test
      DATABASE_URL_TEST: postgresql://postgres:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/acces_direct_aide_test
      VITE_API_URL: http://localhost:3000
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_API_URL: http://localhost:3000

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Runs independently — uses USE_MOCKS=true, no DB needed
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-jammy
    env:
      VITE_API_URL: http://localhost:3000
      CI: true
      LOG_LEVEL: warn
      HOME: /root

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E Tests
        run: npx playwright test --timeout 60000
        env:
          USE_MOCKS: "true"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
