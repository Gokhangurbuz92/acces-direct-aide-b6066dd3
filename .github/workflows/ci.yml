name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Quality & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/acces_direct_aide"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/acces_direct_aide"
      # Skip DB setup during tests if supported by scripts
      SKIP_DB_SETUP: "true"
      # Build flags
      VITE_API_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Mock env vars needed for build
          VITE_PUBLIC_API_URL: "http://localhost:3000"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-jammy
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/acces_direct_aide"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/acces_direct_aide"
      VITE_API_URL: "http://localhost:3000"
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Public Core)
        run: npx playwright test e2e/public-core.spec.js
        env:
          # Ensure mocks are used if implemented via env var or test logic
          USE_MOCKS: "true"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
