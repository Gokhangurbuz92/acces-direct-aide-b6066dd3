name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      # Dummy envs (no secrets). The code should fallback to memory stores where applicable.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      VERCEL_KV_REST_API_URL: ""
      VERCEL_KV_REST_API_TOKEN: ""
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}-v2
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --include=optional

      - name: Verify Rollup Installation
        run: npm list @rollup/rollup-linux-x64-gnu || npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Check Bidi Characters
        run: ./scripts/check-bidi.sh

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify handler imports
        run: node scripts/verify-handler-imports.js

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: E2E (public core & booking, mocked)
        run: CI=1 npx playwright test e2e/public-core.spec.js e2e/booking.spec.js --project=chromium --reporter=line
