name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    # Service Postgres pour tests d'intégration
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      DATABASE_URL: "postgresql://testuser:testpass@localhost:5432/testdb?schema=public"
      POSTGRES_URL_NON_POOLING: "postgresql://testuser:testpass@localhost:5432/testdb?schema=public"
      ADA_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" # 64-char hex = 32 bytes
      JWT_SECRET: "dummy_jwt_secret_for_ci_tests_only"
      CRON_SECRET: "dummy_cron_secret_for_ci_tests"
      ADMIN_TOKEN: "dummy_admin_token_for_ci_tests"
      VITE_API_URL: "http://localhost:3000"
      KV_REST_API_URL: ""
      KV_REST_API_TOKEN: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Database
        run: |
          echo "🗄️ Initializing test database..."
          npx prisma migrate deploy
          echo "✅ Database migrations applied"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit & Integration Tests
        run: npm run test
        env:
          NODE_ENV: test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start Preview Server & Run E2E
        # Starts the preview server in background and runs tests against it
        run: |
          npm run build
          npm run preview -- --port 4173 &
          sleep 5
          npx playwright test e2e/booking.spec.js e2e/public-core.spec.js
        env:
          CI: true
