name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
      ADA_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" # 64-char hex = 32 bytes
      JWT_SECRET: "dummy_jwt_secret"
      VITE_API_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Database
        run: |
          npx prisma generate
          npx prisma db push --force-reset --skip-generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify Handler Imports
        run: node scripts/verify-handler-imports.js

      - name: Unit Tests
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start Preview Server & Run E2E
        # Starts the preview server in background and runs tests against it
        run: |
          npm run build
          npm run preview -- --port 4173 &
          npx playwright test e2e/booking.spec.js e2e/public-core.spec.js
        env:
          CI: true
