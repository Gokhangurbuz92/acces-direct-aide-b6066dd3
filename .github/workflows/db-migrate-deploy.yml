name: DB Migrate Deploy (manual)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy Migrations (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check staging database secret
        id: staging_guard
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          if [ -z "$DATABASE_URL_STAGING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL_STAGING missing. Skipping staging migration deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Drizzle push schema (staging)
        if: steps.staging_guard.outputs.skip == 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: npx drizzle-kit push

  deploy-prod:
    name: Deploy Migrations (prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production database secret
        id: prod_guard
        env:
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          if [ -z "$DATABASE_URL_PROD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL_PROD missing. Skipping production migration deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Drizzle push schema (prod)
        if: steps.prod_guard.outputs.skip == 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: npx drizzle-kit push
