name: Secrets Scan (gitleaks)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Note: we intentionally scan the workspace (not full git history) to avoid
      # blocking CI on historical leaks while still preventing new ones.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --no-git --redact --source .
