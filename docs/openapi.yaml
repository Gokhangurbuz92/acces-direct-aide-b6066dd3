# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# COMPONENTS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cronSecret:
      type: apiKey
      in: header
      name: x-cron-secret

  schemas:
    Aide:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        titre:
          type: string
        categorie:
          type: string
        est_urgent:
          type: boolean
        cest_quoi:
          type: string
        pour_qui:
          type: string
        ce_que_ca_aide:
          type: string
        documents_necessaires:
          type: array
          items:
            type: string
        lien_demande:
          type: string
          format: uri
        summary_falc:
          type: string
        statut:
          type: string
          enum: [brouillon, publie, archive]
        quality_score:
          type: integer
          minimum: 0
          maximum: 100
        updatedAt:
          type: string
          format: date-time

    Structure:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        nom:
          type: string
        type_structure:
          type: string
        adresse:
          type: string
        ville:
          type: string
        departement:
          type: string
        telephone:
          type: string
        email:
          type: string
          format: email
        horaires:
          type: string
        accessibilite_pmr:
          type: boolean
        latitude:
          type: number
        longitude:
          type: number

    Demarche:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        titre:
          type: string
        categorie:
          type: string
        description_courte:
          type: string
        delai:
          type: string
        documents_necessaires:
          type: array
          items:
            type: string
        lien_officiel:
          type: string
          format: uri
        summary_falc:
          type: string

    Actualite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        titre:
          type: string
        contenu:
          type: string
        date_publication:
          type: string
          format: date-time
        source:
          type: string
        summary_falc:
          type: string
        categorie:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        requestId:
          type: string
