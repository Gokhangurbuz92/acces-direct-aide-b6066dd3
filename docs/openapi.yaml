openapi: 3.1.0
info:
  title: API Accès Direct Aide
  description: |
    Interface souveraine pour le diagnostic et l'orientation sociale.
    
    ## Authentification
    - **Admin** : Header `Authorization: Bearer <ADMIN_TOKEN>`
    - **Pro** : Header `Authorization: Bearer <JWT>`
    - **Cron** : Header `x-cron-secret: <CRON_SECRET>`
    - **Public** : Aucune authentification requise
  version: 1.0.0
  contact:
    name: Équipe ADA
    url: https://www.accesdirectaide.fr

servers:
  - url: http://localhost:3000/api
    description: Développement local (Vite dev server)
  - url: https://www.accesdirectaide.fr/api
    description: Production (Vercel)

tags:
  - name: Health
    description: Endpoints de santé et monitoring
  - name: Auth
    description: Authentification citoyens
  - name: Admin
    description: Administration (token statique requis)
  - name: Pro
    description: Espace professionnel (JWT requis)
  - name: Aides
    description: Catalogue des aides sociales
  - name: Démarches
    description: Démarches administratives
  - name: Structures
    description: Annuaire des structures d'accompagnement
  - name: Actualités
    description: Flux d'actualités sociales
  - name: Assistant
    description: Assistant IA (chatbot + recommandations)
  - name: Diagnostic
    description: Calcul des droits via OpenFisca
  - name: Public
    description: Endpoints publics (rendez-vous, stats)
  - name: Cron
    description: Tâches planifiées (ingestion, maintenance)
  - name: Monitor
    description: Monitoring et observabilité

paths:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # HEALTH & MONITORING
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /health:
    get:
      summary: Health check simple
      tags: [Health]
      responses:
        "200":
          description: Service opérationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /health/deep:
    get:
      summary: Health check approfondi (DB, cache, storage)
      tags: [Health]
      responses:
        "200":
          description: Tous les sous-systèmes opérationnels
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  deps:
                    type: object

  /monitor/core:
    get:
      summary: Métriques de santé globales
      tags: [Monitor]
      responses:
        "200":
          description: Métriques de santé

  /monitor/data-quality:
    get:
      summary: Indicateurs de qualité des données
      tags: [Monitor]
      responses:
        "200":
          description: Score de qualité des données

  /monitor/ingestion-freshness:
    get:
      summary: Fraîcheur des données ingérées
      tags: [Monitor]
      responses:
        "200":
          description: Dernière date d'ingestion par source

  /monitor/cron/actualites:
    get:
      summary: Statut du cron actualités
      tags: [Monitor]
      responses:
        "200":
          description: Dernière exécution et résultats

  /monitor/pro-rdv:
    get:
      summary: Métriques rendez-vous Pro
      tags: [Monitor]
      responses:
        "200":
          description: Stats des rendez-vous

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # AUTH (Citoyens)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /auth/signup:
    post:
      summary: Inscription citoyen
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: Compte créé, email de vérification envoyé
        "409":
          description: Email déjà utilisé

  /auth/login:
    post:
      summary: Connexion citoyen
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: JWT retourné
        "401":
          description: Identifiants invalides

  /auth/me:
    get:
      summary: Profil de l'utilisateur connecté
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Données utilisateur
        "401":
          description: Non authentifié

  /auth/logout:
    post:
      summary: Déconnexion
      tags: [Auth]
      responses:
        "200":
          description: Session invalidée

  /auth/verify-email:
    post:
      summary: Vérification d'email
      tags: [Auth]
      responses:
        "200":
          description: Email vérifié

  /auth/resend-verification:
    post:
      summary: Renvoi de l'email de vérification
      tags: [Auth]
      responses:
        "200":
          description: Email renvoyé

  /auth/forgot-password:
    post:
      summary: Demande de réinitialisation de mot de passe
      tags: [Auth]
      responses:
        "200":
          description: Email de réinitialisation envoyé

  /auth/reset-password:
    post:
      summary: Réinitialisation du mot de passe
      tags: [Auth]
      responses:
        "200":
          description: Mot de passe mis à jour

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # AIDES (Catalogue)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /aides:
    get:
      summary: Liste des aides sociales
      tags: [Aides]
      parameters:
        - name: categorie
          in: query
          schema:
            type: string
        - name: territoire
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: statut
          in: query
          schema:
            type: string
            enum: [publie, brouillon, archive]
      responses:
        "200":
          description: Liste paginée des aides
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Aide"
                  total:
                    type: integer
                  page:
                    type: integer

  /aides/{slug}:
    get:
      summary: Détail d'une aide par slug
      tags: [Aides]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détail de l'aide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Aide"
        "404":
          description: Aide non trouvée

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DÉMARCHES
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /demarches:
    get:
      summary: Liste des démarches administratives
      tags: [Démarches]
      parameters:
        - name: categorie
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Liste paginée des démarches

  /demarches/{slug}:
    get:
      summary: Détail d'une démarche par slug
      tags: [Démarches]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détail de la démarche
        "404":
          description: Démarche non trouvée

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STRUCTURES (Annuaire)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /structures:
    get:
      summary: Liste des structures d'accompagnement
      tags: [Structures]
      parameters:
        - name: ville
          in: query
          schema:
            type: string
        - name: departement
          in: query
          schema:
            type: string
        - name: type_structure
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Liste paginée des structures

  /structures/{slug}:
    get:
      summary: Détail d'une structure par slug
      tags: [Structures]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détail de la structure
        "404":
          description: Structure non trouvée

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ACTUALITÉS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /actualites:
    get:
      summary: Liste des actualités sociales
      tags: [Actualités]
      parameters:
        - name: categorie
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Liste paginée des actualités

  /actualites/{slug}:
    get:
      summary: Détail d'une actualité
      tags: [Actualités]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détail de l'actualité
        "404":
          description: Actualité non trouvée

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # SEARCH
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /search:
    get:
      summary: Recherche full-text unifiée (aides, démarches, structures)
      tags: [Aides, Démarches, Structures]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [aides, demarches, structures, actualites]
      responses:
        "200":
          description: Résultats de recherche

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # TAXONOMY
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /taxonomy:
    get:
      summary: Catégories et situations de vie disponibles
      tags: [Aides]
      responses:
        "200":
          description: Taxonomie complète

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ASSISTANT IA
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /assistant/chat:
    post:
      summary: Discussion avec l'assistant IA
      tags: [Assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  maxLength: 2000
                context:
                  type: object
                  description: Contexte de la conversation
      responses:
        "200":
          description: Réponse de l'assistant
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                  suggestions:
                    type: array
                    items:
                      type: string
        "429":
          description: Rate limit atteint

  /assistant/recommendations:
    get:
      summary: Recommandations personnalisées
      tags: [Assistant]
      parameters:
        - name: situation
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Liste de recommandations

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIAGNOSTIC (OpenFisca)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /diagnostic:
    post:
      summary: Calcul des droits sociaux via OpenFisca
      tags: [Diagnostic]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                situation:
                  type: object
                  description: Situation du foyer (revenus, composition, logement)
      responses:
        "200":
          description: Résultat du diagnostic (RSA, APL, Prime d'activité)
          content:
            application/json:
              schema:
                type: object
                properties:
                  eligibility:
                    type: object
                  explanations_falc:
                    type: object
        "502":
          description: Erreur OpenFisca

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PRO MODULE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /pro/auth/login:
    post:
      summary: Connexion professionnelle
      tags: [Pro]
      responses:
        "200":
          description: JWT professionnel retourné

  /pro/auth/register:
    post:
      summary: Inscription professionnelle
      tags: [Pro]
      responses:
        "201":
          description: Compte pro créé (en attente validation)

  /pro/me:
    get:
      summary: Profil du professionnel connecté
      tags: [Pro]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Données du professionnel

  /pro/services:
    get:
      summary: Services de la structure du professionnel
      tags: [Pro]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des services

  /pro/appointments:
    get:
      summary: Rendez-vous de la structure
      tags: [Pro]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des rendez-vous

  /pro/slots:
    get:
      summary: Créneaux disponibles
      tags: [Pro]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Créneaux libres

  /pro/availability:
    get:
      summary: Règles de disponibilité
      tags: [Pro]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Disponibilités configurées

  /pro/rdv/settings:
    get:
      summary: Paramètres de rendez-vous de la structure
      tags: [Pro]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configuration RDV

  /pro/messages:
    get:
      summary: Messages du professionnel
      tags: [Pro]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Messages

  /pro/timeoff:
    get:
      summary: Congés et absences
      tags: [Pro]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des congés

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PUBLIC BOOKING
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /appointments:
    post:
      summary: Prise de rendez-vous citoyen
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [structureId, serviceId, startAt, beneficiaryName]
              properties:
                structureId:
                  type: string
                serviceId:
                  type: string
                startAt:
                  type: string
                  format: date-time
                beneficiaryName:
                  type: string
      responses:
        "201":
          description: Rendez-vous créé

  /appointments/cancel:
    post:
      summary: Annulation de rendez-vous
      tags: [Public]
      responses:
        "200":
          description: Rendez-vous annulé

  /public/stats:
    get:
      summary: Statistiques publiques de la plateforme
      tags: [Public]
      responses:
        "200":
          description: Compteurs agrégés

  /public/availability:
    get:
      summary: Disponibilités publiques d'une structure
      tags: [Public]
      parameters:
        - name: structureId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Créneaux disponibles

  /public/suggest-structure:
    post:
      summary: Suggestion d'une nouvelle structure
      tags: [Public]
      responses:
        "201":
          description: Suggestion enregistrée

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # CONTENT
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  /drees:
    get:
      summary: Données DREES (statistiques sociales)
      tags: [Aides]
      responses:
        "200":
          description: Données DREES

  /guides:
    get:
      summary: Guides pratiques
      tags: [Démarches]
      responses:
        "200":
          description: Liste des guides

  /ressources:
    get:
      summary: Ressources documentaires
      tags: [Aides]
      responses:
        "200":
          description: Liste des ressources

  /dispositifs:
    get:
      summary: Dispositifs d'aide
      tags: [Aides]
      responses:
        "200":
          description: Liste des dispositifs

  /feedback:
    post:
      summary: Envoi de feedback utilisateur
      tags: [Public]
      responses:
        "201":
          description: Feedback enregistré

  /reports:
    get:
      summary: Rapports de données
      tags: [Admin]
      responses:
        "200":
          description: Rapports disponibles

  /pdf:
    get:
      summary: Export PDF d'une aide ou démarche
      tags: [Public]
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [aide, demarche]
        - name: slug
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Document PDF
          content:
            application/pdf: {}

  /upload:
    post:
      summary: Upload de fichier (justificatifs)
      tags: [Public]
      responses:
        "200":
          description: Fichier uploadé

  /download:
    get:
      summary: Téléchargement de fichier
      tags: [Public]
      responses:
        "200":
          description: Fichier

